					    					    <p><strong><a href="#Paskaits">Paskaits</a></strong> ast dēiws sejānts sen zemmin be kawīds ast pa swēntasmu bezzu. J. Bretkūns peisāi, kāi <a href="#Paskaits"><strong>Paskaits</strong></a> ast dēiws, waīdants zemmes wēisjans be dīgi arrjans.&nbsp;Pa J. Maleckan &mdash; papekātajs stēisan swēntan meddjan.</p>

<p>Ezze tennan en <a href="http://awizi.twanksta.org/etnografija/sudawisks-laiskiks/"><em>Sūdawisku lāiskiku</em></a>:</p>

<blockquote>
<p>Buttan stesse dēiwan en zemmei pa saiwāgarjan. &Scaron;in garrjan tenēi laikka per zmōnewingjan be swentan. Pa tennan perpēda di gēitin, pīwan be kittan īdjan be madli di tennan erswāikstintun swāise Markapāljans (Markopolan) be autengīntun swāise <a href="#barzduks">bārzdukans</a> (Parstucken) (līkutai zmānes) en tenēisan jaūjan, kāi tenēi perpēdlai stwen gēitin be kāi labbai erlaikālai stan, ka jāu perpēstan.</p>
