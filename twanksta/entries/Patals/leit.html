					    <div class='rightimage'><a class='fullview' href='/upload/patals.png'><img src='/upload/sm_patals.png'></a><p><strong>Patals</strong> na <strong> Wīdawutjas karjangun</strong>. Autōrs <strong>S. Grunau (XVI mm.)</strong>, panzdau ilustraciōni pastāi kōpitan pra kittans autōrans.</p>
</div>					    <p>Dēiws <a href="#Patals"><strong>Patals</strong></a> paminītan pirman rēizan en 1418 m. en <em>Collatio Episcopi Varmiensis Facta Coram Summo Pontifice Per Dominum Andream, Plebanum In Danczk</em> (Wārmis bīskapas pawakisnā pāwestu per Gudānitas pappan rikijjan Andrjan):</p>

<blockquote>
<p>[..] Ōrdens&nbsp;enwaidinna, kāi&nbsp;ast spārts padāwingi. Kāigi spārts tāns druwēi en Dēiwan, prēi pagaūsenin tūliskan pawaidinna brenduns Prūsas erkarjaūsnas naūtins. Iz stan tāutan en subsmu pagaūsnju bēi prāts izgūntun be bēi izgūntan zmānes &scaron;lūzintjai demōnamans, zmāninantjai <a href="#Patals">Patalan</a>, <a href="#Patrīmps">Natrīmpan</a>, be kittans nigīdingjans fantāzmans [..]</p>
</blockquote>

<p>Dīgi&nbsp;<span style="line-height: 1.6em;">paminītan en 1529 m. en <strong>Simōnas Grunau</strong> (1470-1530) <em>Prūsiskai krōnikei</em>:</span></p>

<blockquote>
<p>Prei pirman tenēi zēidi <a href="#Prutennis">Prutennju</a> be tenesse deiwammans sklāitewingiskans buttans. Deiwāi bēi trīs: <a href="#Patals">Patals</a> (Patollo), <a href="#Patrimps">Patrīmps</a> (Patrimpo) be <a href="#Perkuns">Perkūns</a> (Perkuno), tenēisan [buweīns] bēi ussjan wāltin stāras anzans.</p>
</blockquote>

<p><strong>M. Prātorius</strong> autenginna prei <strong>Hennenbergeran</strong>, kaddan ebpeisāi <a href="#Patals"><strong>Patalan</strong></a> be <a href="#Ramawa"><strong>Rāmawan</strong></a>:</p>

<blockquote>
<p>Be tāns [&mdash; anzans] turīwuns trins wippins: na aīnan bēi bēi tenēisan dēiwas <a href="#pikuls">Pikolio</a> (Pickollos), anga <a href="#Patals">Patalas</a> (Potollos), etwaidinsnā, sen ilgan siwaskebbelingin bārdan, bālan kāigi prēi nigiwītan prusnan, sen gaīlan pastan na galwan, dirīwusis iz pakaktan. Tenesse zentlan be teisinā bēi zmānes be pekkus kērpetis. Per debīkans swentikans en tenesse teīsin en pādamans deginna di lajjan. Be tāns deznimai perwaidinna si en buttamans stēisan lāiman zmānin, sklāitewingi, ik stwen ainunts wīrst aulaūwuns, tenēi ni kwaitīwusis tūlan apperautun deiwammans &mdash; stawīdan tāns lāilina en naktins, adder ik pergūbi tīrtan rēizan, sta tenesmu prawerēi apperautun zmānes krāujan &mdash; staddan waidilāts pjaūwa sebbei rānkan, kāi tāns īmlai kraujātektwei, be ik en anzanu kirdītwei burblelausna, sta bēi pakawīngi &nbsp;(pakkajas) zentlan.</p>
</blockquote>
