					    <div class='rightimage'><a class='fullview' href='/upload/patrimps.png'><img src='/upload/sm_patrimps.png'></a><p><strong>Patrīmps</strong> na <strong> Wīdawutjas karjangun</strong>. Autōrs <strong>S. Grunau (XVI mm.)</strong>, panzdau ilustraciōni pastāi kōpitan pra kittans autōrans.</p>
</div>					    <p>En prūsiskamans pamīntlans mazīngi widātun stawīdans wariāntins stesse wīrdan: ​<em>Patrimpo, Patrimpos, Patrympos, Patrumppo, Potrimpo, Potrimppo, Potrimpus, Potrympus, Potrymp&uuml;s, Potrumppus, Protrimpos, Protrympus</em> be t.t.</p>

<p>Dēiws <a href="#Patrīmps">Patrīmps</a>&nbsp;paminītan kāigi <em>Natrīmps</em>&nbsp;en 1418 m.&nbsp;en <em>Collatio Episcopi Varmiensis Facta Coram Summo Pontifice Per Dominum Andream, Plebanum In Danczk</em> (Wārmis bīskapas pawakisnā pāwestu per Gudānitas pappan rikijjan Andrjan):</p>

<blockquote>
<p>[..] Ōrdens enwaidinna, kāi ast spārts padāwingi. Kāigi spārts tāns druwēi en Dēiwan, prēi pagaūsenin tūliskan pawaidinna brenduns Prūsas erkarjaūsnas naūtins. Iz stan tāutan en subsmu pagaūsnju bēi prāts izgūntun be bēi izgūntan zmānes &scaron;lūzintjai demōnamans, zmāninantjai <a href="#Patals">Patalan</a>, <a href="#Patrīmps">Natrīmpan</a>, be kittans nigīdingjans fantāzmans [..]</p>
</blockquote>

<p>Dēiws <a href="#Patrimps"><strong>Patrīmps</strong></a>&nbsp;sen swāise emnin&nbsp;paminītan pirman rēizan en&nbsp;1529 m. en <strong>Simōnas Grunau</strong> (1470-1530)&nbsp;<em>Prūsiskai krōnikei:</em></p>

<blockquote>
<p>Prei pirman tenēi zēidi <a href="#Prutennis">Prutennju</a> be tenesse deiwammans sklāitewingiskans buttans. Deiwāi bēi trīs: <a href="#Patals">Patals</a> (Patollo), <a href="#Patrimps">Patrīmps</a> (Patrimpo) be <a href="#Perkuns">Perkūns</a> (Perkuno), tenēisan [buweīns] bēi ussjan wāltin stāras anzans.</p>
</blockquote>

<p><strong>M. Prātorius</strong> autenginna prei <strong>Hennenbergeran</strong>, kaddan ebpeisāi <a href="#Patrimps"><strong>Patrīmpan</strong></a>&nbsp;be <a href="#Ramawa"><strong>Rāmawan</strong></a>:</p>

<blockquote>
<p><a href="#Patrimps">Patrīmps</a> (Potrimpo) bēi mālds wīrs, sklāit bārdan, turīwuns krōnin iz &ldquo;kalsans&rdquo;, wessels, ni turīwuns smijānin, kāi <a href="#Perkuns">Perkūns</a> (Perkuno) ast nērtingis. Tenesse zentlan bēi angzdris en debīkasmu pādu, maitātan sen daddan be ebstegtan sen arrjas kurkans. Tenesmu deginna waskan be labasmīrdan, en tenesse teīsin malnīkai bēi dīgi apperautan.&nbsp;</p>
</blockquote>
