				    <div class="descripcio">
					    					    <p><strong><a href="#Pergrubris">Pergrubris</a></strong> ast wassaras be aūgmenijas dēiws en prūsiskai mitolōgijai. Pa <a href="http://awizi.twanksta.org/etnografija/sudawisks-laiskiks/"><em>Sudāwiskan lāiskikan</em></a>:</p>

<blockquote>
<p><a href="#Pergrubris">Pergrubris</a> &nbsp;(Pergrubrius) &mdash; augīna lappans be zāljans</p>
</blockquote>

<p><a href="#Pergrubris"><strong>Pergrubrju</strong></a> ast palikītan pirms kalēndarisks swēntiks (&mdash; pergrubrjai), etwerīnts wassaran, kaddan en laūku izwezza di plūgan be iztarra emnins stēisan dēiwan, en pagaūsenju, subban <strong><a href="#Pergrubris">Pergrubrijan</a></strong>. Ezze stan papeisātan en <a href="http://awizi.twanksta.org/etnografija/sudawisks-laiskiks/"><em>Sudāwisku lāiskiku</em></a>:</p>

<blockquote>
<p>Tenesse pirmans swentikans swentinna di pirzdau stan, kāigi ēitwei sen plūgan en laūkans. Stans swentikans tenēi bilāi per <a href="#Pergrubris">Pergrubrjas</a> (Pargrubrij) apperausnan. En wisēimans kāimans tenēi ēit en ainan buttan. Stwen pagattawinta debīka kannawi anga pīwas dwāi kannawis. <a href="#warskaits">Wārskaits</a> (Wourschkaite) erlāngja plasan kārtin, pilnan pīwas, sen rānkan be madli &bdquo;Ō, galwe be dēbe dēiwe <a href="#Pergrubris">Pergrubri</a> (Pargrubrius), tū izgunna zēiman prēipaus be wartīna etwārtai pastipasmu tāutan lappans be zāljans, mes madlimai ten, kāi tū be paaugīnlai nūse arrjan be pernaikīnlai wissans nizāljans&ldquo;.</p>
</blockquote>

<p>Ezze&nbsp;<span style="font-weight: 700;"><a href="#Pergrubris">Pergrubrjan</a></span> dīgi peisāi <strong>M. Prātorius</strong>&nbsp;(~1635 m. &mdash; 1704 m), tāns nadāst swāise etimolōgijan, be dīgi peisāi dīgi ezze stan swēntikan, pastippan skaitāimai ezze stan <a href="http://awizi.twanksta.org/etnografija/pratorijus-kurka/">stwi</a>:</p>

<blockquote>
<p>[...] prawerru waīstun, kāi Pergubrius pertīnka ezze Peř gū berū, sta ast diserativum, be zentli zūrgiskai &nbsp;&laquo;kwaitītun permaisātun&raquo;, &laquo;kwaitītun ka nika perteikātun&raquo;, stwi perteikāntei zemmin bilāi di &laquo;perguberu dirwą&raquo;, &laquo;as kwaitēi teinū laūkan perteikātun&raquo;, teinū as wīrst segīwuns stan dēlan, dīgi &laquo;pergubyk z̀emę̂&raquo; &mdash; sta ast &laquo;perteikāis stan zemmin labbai&raquo;. Dīgi preigērbjantei engnāstun zīngslan, jaūku bilāi di: &laquo;pergubyk, iszgubyk man gerrai&raquo;, &laquo;engnātais tennan labbai&raquo;, &laquo;permaisāis tennan labbai&raquo;, be t.t.<br />
Dīgi Pergrubris pastānja swentintan be en pālju, be en assanei, beggi tenēi paskalītai, kāi &laquo;dēlinikan&raquo; tenēimans prawerru be en wassaran, kaddan gattawina laūkans prei daggas sīsnan be kadda prawerru tennans perteikātun prei zēimas sīsnan. En pāljan, kaddan delāi pagaūnja si, tenēi madli tennan ezze pagalban, kaddan īst skjāurin galwans en tenesse zmānin, astis en stesmu, kāi nadrāuwjai be skallawjai segēi stan wis dabber. En assanin, pjaūwusis āustan, tenēi tennan per stan dīnkau, adder kāigi tenēi laikāi si en stesse upperas kēsman&mdash; gadāimai tūls gērdautun, wīrst ebwaitjāwusis wīrdan Pergubrius.</p>
</blockquote>
