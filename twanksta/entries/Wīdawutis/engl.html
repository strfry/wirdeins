					    <div class='rightimage'><a class='fullview' href='/upload/Erbi.jpg'><img src='/upload/sm_Erbi.jpg'></a><p><strong>Prūsiska ērbi sen Rāmawas trēitan stēisan dēiwan — Perkūnan, Patrīmpan be Patallan. Prei tikrai ast Wīdawutis be prei kāirai — Pratennis</strong>. Iliustraciōni iz <strong>Georgas Mehlmannas</strong> krōnikin <em>Chronica und Beschreibung des Landes Preussen</em> (1547 m.)</p></div>					    <p><a href="#Widawutis"><strong>Wīdawutis</strong></a> be <a href="#Pratennis"><strong>Pratennis</strong></a>, en prūsiskai mitolōgijai, ast kultūras erōjai, brātjai (mazīngi ast dwīnjai). Pa appuns stesse 16mm. <a href="#Widawutis"><strong>Wīdawutis</strong></a>&nbsp;be&nbsp;<a href="#Pratennis"><strong>Pratennis</strong></a>, perjāja en Prūsan pa jūrjan prei <strong>Wīkslas</strong> āustjan. <a href="#Widawutis"><strong>Wīdawutis</strong></a> enteikāi sōcialiskan ōrganizacijan, swētewiskan rikaūsnan, bēi prūsisks kunnegs.</p>

<h2>Wīdawutjas karengus</h2>

<p>Trīs deiwāi glaubātai en <a href="#Wīdawutis"><strong>Wīdawutjas</strong></a> karengu: <strong><a href="#Patals">Patals</a></strong>, <strong><a href="#Perkūns">Perkūns</a></strong>, <strong><a href="#Patrīmps">Patrīmps</a></strong>. Ezze karengun peisāwuns prūsiskas istōriniks <strong>Simōns Grūnaws</strong>, pa tenesse ebpeisāsenins <strong>Christoph Hartknoch</strong> glaubāwuns glaubālin. Mīri di, kāi karengus ilgan bēits 5 alkūnai, adder platti bēits 3 alkūnai. Mazīngi karengus pastāi tērpautan kāi ni widālai ālkan.</p>

<p>Na karengun mazīngi widātun nōpeisan, nieīsku ka tennan zentli.</p>
