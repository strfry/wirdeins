					    					    <p><a href="#angzdris">Angzdrjai</a> ast zmānintan be swentan, en swāise buttamans zmānes turēi buttiskans <a href="#angzdris">angzdrjans</a>, tenēi pastāi maitīntan be zmānintan.&nbsp;Ezze stan tūlan peisāi<strong> M. Prātorjan</strong> (XVII mm.), pastippan ezze stan mazīngi skaitātun <a href="http://awizi.twanksta.org/etnografija/zmaninsna-steisan-angin/">stwi</a>:</p>
