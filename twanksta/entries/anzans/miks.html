					    <div class='rightimage'><a class='fullview' href='/upload/anzans.jpg'><img src='/upload/sm_anzans.jpg'></a><p><strong>Rāmawas anzans</strong>. <strong>M. Prātorjas</strong> (XVII mm.) iliustrācija.</p>
</div>					    <p>Kaddan bilāimai ezze anzanan, prawerru gērdautun, kāi prūsamans bei swentan ni tēr <a href="#anzans">anzanai</a>, adder kitāi garrjai dīgi. Ezze stan peisāi <strong>M. Prātorius</strong>:</p>

<blockquote>
<p>Waraprūsai ni enbāndan eraīnan anzanan anga garrjan laikāi per swentans, adder jāuku be rombhota, sta ast stawīdan, kawīdan tēt sen swāise stibbans senaūguns anga kīrs pratreppa wissans kittans sen aūktan anga plattu. Sklāitewingi, ik na garrjan aūga emelna. Stawīdai anzanai nadrāwai anga skallawjai kliptinai ēmpersin sadīna zmānintun be teinū. Waraprūsai laikāi stawīdans anga kittas pērgimis garrjans per swentan.</p>
</blockquote>

<p>Ezze malkans stēisan anzanan dīgi prawerru paminītun, ezze stan peisāi dīgi <strong>M. Prātorius</strong>:</p>

<blockquote>
<p>En aulemtans rittuns be dājans prei Kurkan dīgi prawerru warīntun nōdan. Pirzdau wissan prei swentan anzanan bēi prābutiskai degānti pannu, kawīdan [tēt bilītai] waīdilats anga zignāts turēi sargātun, etrāntei sen swāise galwan.<br />
Malkan ebpeisāsenjan, sen kawīdans enlaikāi pannu, arwiskai ni mazzi aupaltun. Ikāi mazīngi gadātun, kāi sta bēi anzanan malkas, beggi stas malkas {empēreniskai} en Prūsai bēi palīkitan per &scaron;lūzin deiwammans, dīgi bēi ukabrewīngis iz wissan, beggi tenesses dūms pastāi laikātan per kailūstan be ezze anzanan malkamans tīnka ni spārts debīks lāps, tennas sklaitewīngi ni preskēi be dīgi ezze tenēimans ni ast tūlan spānkstjas, palīgintei sen adlin be apsin. Anzanas anglis ilgai erlāika gārmin, stesse paggan mazīngi ilgais enlaikātun pannu iz stans malkans. Ik ni ast anzanan malkas, tenēi mazēi tērpautun skāberwjan, beggi en emprīkisentin kēsman nadrāuwjai jāuku tērpaui stan garrjan, kaddan en swāise jaūjamans gattawina pirmicijans&nbsp;&mdash; apperaui pirmans senrīnkusjans zirnins (pagār pagūnibis drūwisnan), tēt be per <a href="#Kurka">Kurkan</a> be <a href="#Patrimps">Patrīmpan</a>, kawīdan zmānina sen emnin Gabiauga, adder kaūlans deggina en pannu. Gi entikriskai stan garrjan ni dāst spārtan lāpan, ni spānkstjans, dīgi sūit ilgai enlaikāi dūmawintjans anglins. En stesmu pannu endegga be degga apperan.</p>
</blockquote>

<p>Stawīdans pawīstins mazīngi widātun ni tēr prei prūsans. Prawerru paeīskintun, kāi panniskan&nbsp;aulaūwusimans zmānimans pateikāi dīgi iz malkans stēisan anzanan. Anzans en baltaskai mitolōgijai ast <a href="#Perkuns">Perkūnas</a> garris.&nbsp;Stan mazīngi widātun dīgi prei kursjans, ezze ka peisāi <strong>Ghillebert de Lannoy</strong> en <em>Voyages et Ambassades</em> (Pintegas be&nbsp;tengīntinistas):</p>

<blockquote>
<p>Wārai kursjai, ikāi sirzdau tennans ast pra&nbsp;preispārtinsnan&nbsp;patikināntjai&nbsp;krikstjānai, turri aīnan sektan, kawīdas&nbsp;streīpstai pa gallan en deīktu, kāi tenēi būlai enkāptan, tenēi ast deggintan en ukataūwu meddju, eraīns sen walnans swāise rūkans be&nbsp;ēnrankjans, kurra panniskan iz skīstans malans stēisan anzanan; ik dūms ēit&nbsp;ent&igrave;kriskai en dangun, druwēi di, kāi welē ast izrankītan, ik&nbsp;dūmaui en pāusan, mēri, kāi welē ast izmāitintan.&nbsp;</p>
</blockquote>

<p>Ezze zmānintan <a href="#Ramawa">Rāmawas</a> anzanan papeisātan tūlan:</p>

<blockquote>
<p>Stawīds zmānints <a href="#anzans">anzans</a>&nbsp;en <a href="#Ramawa">Rāmawai</a>&nbsp;(Romove) pastāi ebpeisātan ēst pra wissans prūsiskans peisālenikans tēt, kāigi tālis dātan; Hennenbergas wirdāi, kaddan tāns bilāi ezze Trēitas kla&scaron;toran en &ldquo;Paeīskinsnai stēisan prūsiskan tāutaskartin&rdquo;, ast stawīdai: &nbsp;stas pikuliskas anzans stalāi en Eikāitai, kāigi as papresta, en Nātangas sirdu, kwēi teinū ast Swentas Trēitas kla&scaron;tōran. Tenēisan plattu bēi 6 wāltis, ūnzai tāns bēi spārts plattu be stawīds kāmstus, kāi ni sūji, ni snāigs ni mazēi sprūtwei, beggi tāns be zēimai ni metti swāise lappans be zalli. Be tāns turīwuns trins wippins [...]</p>
</blockquote>
