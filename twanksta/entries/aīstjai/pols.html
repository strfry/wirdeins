				    <div class="descripcio">
					    					    <p>Ezze wārans prūsans (<em>aistii, Aestiorum gentes</em>) pirman rēizan, en wangai stesse I&nbsp;mettasimtas&nbsp;infōrmi rōmisks istōriniks&nbsp;<strong>Tacīts</strong>&nbsp;en&nbsp;<em>De origine et situ Germanorum</em>&nbsp;(Ezze&nbsp;pertiksnan be būsenjan stēisan gērmanjan):</p>

<blockquote>
<p>Tētet, sen tikran krāntan stesse Swēwskas jūrjas* ebzūrgina si zemē stēisan aīstjan gintus, kawīdai turēi pajuksmans be prusnans kāigi prei swewjans, adder bilā bēi tuls palīgu en brītiskan. Tenēi madli mātin stēisan dēiwan be padāi, kāigi swāise drūwjas simbōls, etwaidīnsnan stēisan paustakūiljan. Sta, prei tennans, ersadinantī ēnrankjan gīnsna ezze wisēimans, garantintī lānktaju sārgiskan īr sirzdau prēisikans. Tenēi rettai tērpaui gelzaīnan ēnrankjan, deznimai gi wēzdans. Tenēi sen debīkan kantan dizijja per arrjans be kittans zemmis wēisjans, stu sta etbilāi jāukjai wūlakisnai stēisan germānjan.</p>

<p>Tenēi dīgi en jūrju be tenesse malkammans deīktamans, be īr na subban krāntan senrīnka glēsjan, kawīds ast bilītan &quot;glaesum&quot; pra tennans.</p>
</blockquote>

<p><em>* sta ast Baltijas jūris, stwi Tacīts bilāi ezze Baltijas jūrjas tikran krāntan, kwei buwinna aīstjai. Tenēi buwinna na wissan dēiniskan krāntan &mdash; ezze <strong>Wīkslai</strong> ērgi <strong>Sōmiskan marrjan</strong>.&nbsp;</em></p>
