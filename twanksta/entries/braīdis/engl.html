					    					    <p>Kāi braīdjai ast swentan peisāi <strong>M. Prātorius</strong> (XVII mm.):</p>

<blockquote>
<p>Sklāits stan, kāigi swentai bēi zmānintna braīdjai mazīngi be stesse paggan, kāi sta ast stawīds zwērs, kawīds kitakwēi en Eurōpai ast rettan be wisawīdiskan tērpan paggan bēi spārts prawērtintan pra kittans eurōpjans. Mennei perwaidinna si, kāi <a href="#kriwwis">kriwwis</a> labbai waīda be bēi turīwuns nōdan, kāi stas zwērs ast rettan en Mikskātautai be kitakawēi, stesse paggan tāns [braīdis] bēi sklaitīntan sebbei. Rōsenzweigs en swāise manuskriptu be Hennenbergers paminijja, kāi <a href="#kriwwis">kriwwis</a>, kāigi ukauktums tāutas zmōi, zmānintan kāigi deīws, sklaitinna sebbei be ukapertiksnikan zwerīns (braidīns), dīgi braīdjans laikāi di be papekāi di en swāise buttamans. [&hellip;] Zentlawingi be sta, kāi <a href="#kriwwis">kriwwis</a> laipinna braīdjans, kāigi papekātajans, pawaidīntun en prūsiskas tāutas ērbei.</p>
</blockquote>
