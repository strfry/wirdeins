					    					    <p><a href="#barzduks"><strong>Bārzdukai</strong></a> ast <a href="#Paskaits"><strong>Paskaitas</strong></a> pagalbas; mazāi zmōnjai buwinna pa zemmei. Mazīngi tenēi ast seītan sen lāiman. Pa garrju (jaūku pa bazzu) tenēi laikāi geītan, pīwan be kittan īdjan. &nbsp;</p>

<p>Ezze tennans be <a href="#Paskaits"><strong>Paskaitan</strong></a> en <a href="http://awizi.twanksta.org/etnografija/sudawisks-laiskiks/"><em>Sūdawisku lāiskiku</em></a>:</p>

<blockquote>
<p>Buttan stesse dēiwan [&mdash; <a href="#Paskaits">Paskaitas</a>]&nbsp;en zemmei pa saiwāgarjan. &Scaron;in garrjan tenēi laikka per zmōnewingjan be swentan. Pa tennan perpēda di gēitin, pīwan be kittan īdjan be madli di tennan erswāikstintun swāise Markapāljans (Markopolan) be autengīntun swāise bārzdukans (Parstucken) (līkutai zmānes) en tenēisan jaūjan, kāi tenēi perpēdlai stwen gēitin be kāi labbai erlaikālai stan, ka jāu perpēstan.</p>

<p>&nbsp;</p>
</blockquote>

<p><span style="line-height: 1.6em;">Ezze </span><a href="#barzduks" style="line-height: 1.6em;">barzdukans</a><span style="line-height: 1.6em;">, kawīdai turri buwīntwei prei bezzan peisāi </span><strong style="line-height: 1.6em;">M.&nbsp;Prātorius</strong><span style="line-height: 1.6em;">:</span></p>

<blockquote>
<p>Sklāits stan, waraprūsai laikāi per swentan be kittans garrjans, sklāitewingi bezzan, pa kawīdsmu buwīnats retawīngjai zemmiskai deiwāi, tenēi pastai bilītan per bezdukkai, adder ainunts iz stan teīki wīrdan barzdukkai. Tikran ast en stesmu, kāi sklaitawīdai nadrāwai wis dabber bijja bezzan, beggi bārzdukai, buwīnusis pa tenesmu, &scaron;kūdinats zmānimans, As mēri, kāi sta ast pikuls spīljai glaūdans sen lāngiseilingjans zmānins, adder tāns stwi tērpaui dabban, iz izbandāsenjan gi ast waīstan, kāi pa bezzu ast enwārguliskan ilgai sindītwei anga migītwei, sklāitewingi en wassaran be en kweitāsnas kēsman. En Mīmelei bēi wārika, mīliwusi en rēizans en pussideinan pamigītwei pa bezzu; ēnwangan tenā stesse paggan aumetti āumenin, adder pagaūwuns tennan ārstitun engaūwuns prābutiskan pakkajan rikīs [K]yperus, medicīnin zinānin doktōrs, be sen Dēiwas pagalban tennan izārsti, palaikāwuns tennan delli dēinas en anzanas tīmenei. Mazzi būtwei, kāi spārts smārds dussina &ldquo;gilluwas jūtans&rdquo; be stesse paggan tenēi jāu ni mazzi dēlatwei tikrōmiskai, tēt pikuls tērpaui zmānin nisātausnans, kāi paikīlai be sugerijja wisawīdiskans duslakiskans fantazijans, mazzi paspārtintin gezēirans ezze zemmis deīwans anga, dīwais, bezzas buwīntajans, be ka zentli wīrds bezdukkai, beggi prūsiskai, dīgi kāigi en Nadrāwai be Skallawai, wīrds bezdas zentli &ldquo;bezzan&rdquo;. Zentli bezdukkai &mdash; &ldquo;buwīntjai pāgar bezzan anga ast pāgar tennan, tērupantai tennan&rdquo;.</p>
</blockquote>
