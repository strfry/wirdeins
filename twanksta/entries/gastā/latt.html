					    <div class='rightimage'><a class='fullview' href='/upload/Sudovian_Book_-_sacrifice_of_goat.jpg'><img src='/upload/sm_Sudovian_Book_-_sacrifice_of_goat.jpg'></a><p><strong>Wārskaits</strong>. Iliustraciōni&nbsp;iz&nbsp;<em>Sūdawiskan&nbsp;lāiskikan&nbsp;</em>(XVI mm.).</p>
</div>					    <p><strong><a href="#warskaits">Wārskaits</a>&nbsp;</strong>mazzi būtwei anga waīdils&nbsp;anga kāimas eptmanis. En prūsiskamans pamīntlans mazīngi widātun stawīdans wariāntins stesse wīrdan:&nbsp;​<em>Wourschkaiten, Wourschkaiti, Wourschkaity, Wairschkayty, Warschkait.</em></p>

<p>Prei <strong>Simōnan Grūnawan</strong>:</p>

<blockquote>
<p><em>Kunnegans tenēi bilāi per <a href="#warskaits">wārskaitans</a> (Worskaito).</em></p>

<p><em>[&hellip;]</em></p>

<p><em><a href="#warskaits">Wārskaits</a> (Wurschayto anga Borsskayto) bēi ketwirta dēiwinibi.</em></p>
</blockquote>

<p>En <strong><a href="http://awizi.twanksta.org/etnografija/sudawisks-laiskiks/">Sūdawisku lāiskiskan</a>&nbsp;</strong>pastāi&nbsp;papeisātan stan ezze <a href="#warskaits">Wārskaitan</a>:</p>

<blockquote>
<p>Tenēi izrīnka sebbei wārans wīrans, kawīdans lāika di per teisīwingjans&nbsp;be swentans, be kāigi pēr mans - bīskupai, tīt tenēi&nbsp;ast&nbsp;bilītai&nbsp;per <a href="#warskaits">wārskaitans</a> (Wourschkaity), pra tennans [sūdawjai]&nbsp;zmānina&nbsp;swāise dēiwans, erzinna ezze swāise enwārgsenjans be pertenginna&nbsp;swāise pakwaitīsnans deiwammans.&nbsp;</p>
</blockquote>

<p>Dīgi en&nbsp;<strong><a href="http://awizi.twanksta.org/etnografija/sudawisks-laiskiks/">Sūdawisku lāiskiskan</a>&nbsp;</strong>mazīngi aupaltun, kāi wārskaitai ast&nbsp;bilītai&nbsp;per&nbsp;zignātans:</p>

<blockquote>
<p>Tenēi dīnkauja&nbsp;swāise zignātu&nbsp;(Segnoten), kawīds ast&nbsp;bilīts&nbsp;per&nbsp;<a href="#warskaits">Wārskaitan</a> (Wourschkaiten), spārts zmāninantjai&nbsp;be teīsinantjai.</p>
</blockquote>

<p><strong>Jāns Bretkūns</strong> dīgi peisāi ezze &laquo;sūdawiskans&nbsp;nōseilenikans&raquo;:</p>

<blockquote>
<p>Sūdawjai izrīnka iz swāise zūrgiskan delli wārans wīrans, kawīdai pastāi bilītai&nbsp;per <a href="#warskaits">wārskaitans</a> (Wur&szlig;ka&yuml;tten), be sta&nbsp;zentli zūrgiskai stan subban kāigi bīskaps anga nōseileniks. Tenēi (&mdash; sūdawjai) laikāi tennans per swentans zmānins be spārts&nbsp;zmānina tennans; tenēisan&nbsp;&scaron;lūzisenjai pastāi tērpautai&nbsp;en kēsman stēisan&nbsp;swentikan&nbsp;be religiōzan&nbsp;dāinan.</p>
</blockquote>
