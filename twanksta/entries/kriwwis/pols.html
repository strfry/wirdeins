					    <div class='rightimage'><a class='fullview' href='/upload/kriwwis.jpg'><img src='/upload/sm_kriwwis.jpg'></a><p><strong>Kriwwis</strong>. <strong>M. Prātorjas</strong> (XVII mm.) iliustrācija.</p>
</div>					    <p>Ezze kittans &scaron;lūzitajans stēisan prūsiskan dēiwan peisāi ānkstais, neggi ezze subban kriwwjan. Tēt ezze&nbsp;tulisūnans be lingasūnans papeisātan en&nbsp;<em><strong>Jakōbas</strong>, pāwestas legātas, priwilēgijai</em> (dīgi sta ast bilītan<em>&nbsp;Krīstburgas sawaītis</em>, papeisātan en&nbsp;1249 m.):</p>

<blockquote>
<p>tenēi dīgi taukinna, kāi ni wīrst turīwusis en swāise sirdawisku tulisūnans (/talisūnans) be ligasūnans [...]. Tenēi ikāigi waīdilai, enkāpantjai aulaūwusins, [...] bilāi ezze wārgan be labban, girja&nbsp;<span style="font-size: 17.5px;">aulaūwusins&nbsp;</span>per tenēisan rāngsnan be grābsnans, per niskīstans dēlans be kitawīdans gaddans be grēkans, kawīdans tenēi bēi segīwusis sēntjai giwāi. Erlāngusis akkins en dāngun tenēi izwekkintjai ebgalwāi wīdats stwi pat sēntin nāwan, skrāidantin en dāngu na zīrgan, grazzintan sen blīngewingjans ēnrankjans, pēdantin palkan en rānkai, ēntin en kittan swētan sen debīkan esk<span style="font-size: 17.5px;">ōrtas pulkan.</span>&nbsp;</p>
</blockquote>

<p>Adder pirman rēizan ezze subban <a href="#kriwwis">kriwwis</a> peisāi&nbsp;<strong>Pēters iz Dusburgan</strong>&nbsp;(XIV mm.):</p>

<blockquote>
<p>En &scaron;isse [prūsiskas] amzjas sirdu - en&nbsp;<span style="font-size: 17.5px;">Nadrāuwai - bēi deīktan, ka bēi&nbsp;</span>bilītan per&nbsp;<a href="#Ramawa" style="background-color: rgb(255, 255, 255);">Rāmawan</a>&nbsp;(Romow), [...], kwēi buwinna ainunts bilīts&nbsp;<a href="#kriwwis" style="background-color: rgb(255, 255, 255);">Kriwwis</a>&nbsp;(Criwe), kawīds pastāi zmānints kāigi pāwests, beggi kāigi rikīs pāwests rikaūja kīrsa swētas kīrkin stēisan krikstjānan, tēt dīgi kriwwjas kwāitu be wīrdu paklusta ni tēr paminītai gintu, adder dīgi leītawjai be kitāi amzjāi, buwīnusjai en Liwōnijas zemmei. Stawīda warewīngi bēi tenesse rikausnā, kāi ni tēr tāns subs anga ainunts iz tenesse gintu, adder īr tengīntinis sen tenesse&nbsp;<a href="#kriwwi" style="background-color: rgb(255, 255, 255);">kriwwin</a>&nbsp;anga kittan zinātan zentlan, pintegaūjantjai pra arāikans stēisan āukstais paminītan pagānan, sengīdau debīkan pateīsin iz kunnegans, auktimmiskan be prastans zmānins. Tēt dīgi tenēi teīsina ni<span style="font-size: 17.5px;">gesāntin pannu</span>&nbsp;pa wāriskan pajuksman.&nbsp;</p>

<p>[&hellip;]</p>

<p>Aulaūwusjas wāraisjamans ēntjai prēi&nbsp;<span style="font-size: 17.5px;">paminītan pappan Kriwwjan, prasīntjai anga en stawīdan dēinan be stawīdan naktin tāns ni widāi ainuntan ēntin en tenēisan buttan.&nbsp;</span>Stas&nbsp;<a href="#Kriwwis" style="background-color: rgb(255, 255, 255);">Kriwwis</a>&nbsp; niswirrinantjai gērbuns kawīdai bēi aulaūwusjas rūkai, ēnrankjai, zirgāi be seimīns be pēr māisesan endrūwinsnan tāns bilīwuns, kāi kīrdi, na tenesse buttas staklins aulaūwusis palaīdi aulemtan slaīdan sen kelljan anga kittan ēnrankjan.&nbsp;</p>
</blockquote>

<p><strong>Jāns Dluglō&scaron;s</strong> minijja kriwwjan gērbantjai ezze kriwwjan be <strong>Prāgas Adalbertan</strong>, tāns dīgi ast <span style="font-weight: 700;">Wā</span><strong>itiks</strong> (Wojciech), Prāgas bīskaps, kawīds pastāi ergalīntan en 997 m. en <a href="#Prūsa">Prūsai</a> pra prūsans, ni kwaitīntjai izjātwei iz <a href="#Prūsa">Prūsan</a> be dergīntjai swentan meddjan. Ezze <a href="#kriwwis">kriwwjan</a> stas <strong>Dluglō&scaron;s</strong> peisāi en <em>Krōnikimans be annalamans stesses zmānewingis rīkis Pōlis</em> (Annales seu cronicae incliti Regni Poloniae), XV mettasimtas wangā:&nbsp;</p>

<blockquote>
<p>Prūsai pat, sen graudīnsnan izstalīntei swāise deīwan enēizwinsnans be lāustinsnans, nērti, kāi tenēisan kults be dāinas, enimmusis ezze pirzdaunīkamans, pastāi talkātan pa pīdamans be lāustintan, kaddan gruntauktimmis &scaron;lūžitajs stēisan swēntan dēlan &mdash; Kriwwis be kitāi &scaron;lūzītajai stēisan dēiwan endāusina prūsiskan auktairikīskan, senwaitjāi tennan [&mdash; Adalbertan] ergalīntun.</p>
</blockquote>

<p>En 1517 m. <strong>Mattius Mīhowits</strong> (Maciej Miechowita) āntrina <strong>Pēteran iz Dusburgan</strong> be <strong>Mikkeljan Jerō&scaron;inan</strong>:&nbsp;</p>

<blockquote>
<p>Stas ketturbillas amzjan [s.a. leītawiskan amzjan] en pagānibis kēsmu turēi ainan debban &scaron;lūzitjan, kawīds bēi bilītan <a href="#kriwwis">Kriwwis</a>. Tāns buwwi en mēstu <a href="#Rāmawa">Rāmawa</a> (Romouae), bilītan tēt pas Rōmas ēmnin, beggi stan amzjan bēi labatīngjan, kāi ast iz Wālkijan, be tikrōmiskai en tenesse bīlai ast ainuntkawīdai wālkiskai wirdāi. Ezze stan <a href="#kriwwis">Kriwwjan</a> be mēstan <a href="#Rāmawa">Rāmawan</a> mazīngi skaitātun en gērbai ezze swēntan bīskapan be lailīsnikan <strong>Adalbertan</strong>.</p>
</blockquote>

<p>Kaddan <strong>Simōns Grunau </strong>(XVI mm.) peisāi ezze <a href="#kriwwis">kriwwjans</a>, tāns en pagaūsenju nagīrbaui tenēisan emnins:</p>

<blockquote>
<p>Emnes stēisan pagāniskan kriwwin (kirwaytenn) sklāitiskai: Bruteno, Brodeno, Thywaito I, Deniges, Barausto, Macco, Meruno, Gorusso, Thywaito II, Napayles I, Tolleyno, Thywaito III, Mergonno, Carkoins, Napayles II, Jaugello, Narwasso, Gindewo, Austomo, Molleino, Tayto, Romois, Darsgaito, Mangalo, Bulloisos, Postwo I, Marango, Lawailes, Torroto, Nerges, Vibrotos, Barbaido, Barrando, Jargallo, Tippes, Leiso, Carkoyo, Pomoyls, Postwo II, Napeules II, Thirsgaito, Nadrosso, Bautonos, Tormeyso, Kyrbaido, Alleps [...]</p>
</blockquote>

<p><strong>M. Prātorius</strong> (XVII mm.) nagīrbaui &quot;&scaron;lūzitajans stēisan dēiwan&quot;, ezze stan mazīngi skaitātun <a href="http://awizi.twanksta.org/etnografija/waidilatai-be-waidilai/">stwi</a>:</p>

<blockquote>
<p>Stwi prawerru paminītun, kāi ezze prūsans peisāwusis autōrai bēi dāwusis dīgi kittans emnins kūltas &scaron;lūzitajamans be waidiluttjamans: <em>ƶygenotten, tilusseii</em> anga <em>tilussůnei, lingussůnei, wurszkaitei, burtonei</em>. Prei tennans dabber ast preidātan be stawīdai, kawīdai ast teinū: waszkones, szwakones, dumones, puttones, orones, szweigdzurones, lekkutones, widdurones, krauiuttei, pustones, seitones, sietones, wejones, nerutti, szwalgones,&nbsp;ƶaltones, kaukuczones, sapnones be kt., be mazīngi dabber tūls, beggi tenēisan&nbsp;likkjai dabber ast aupaltan en Zemāitijai be pa Prūsas arāikan &mdash; prei Leītawan be Zemāitijan.&nbsp;</p>
</blockquote>
