				    <div class="descripcio">
					    <div class='rightimage'><a class='fullview' href='/upload/perkuns.png'><img src='/upload/sm_perkuns.png'></a><p><strong>Perkūns</strong> na <strong> Wīdawutjas karjangun</strong>. Autōrs <strong>S. Grunau (XVI mm.)</strong>, panzdau ilustraciōni pastāi kōpitan pra kittans autōrans.</p>
</div>					    <p>Mazīngi gērdautun, kāi pirman rēizan <a href="#Perkuns"><strong>Perkūns</strong></a> paminītan en 41-44 mm., <strong>Titus Pomponius Mela</strong> peisāwuns ezze stan. Subs tāns ni tērpau ni wīrdan <em>Perkūns</em>, ni <em>prūsai</em>. En swāise krōnikei tāns peisāi ezze neurans (latīn. <em>Neuris</em>, grēk. <em> Neur&oacute;i</em>) be tenēisan dēiwan&nbsp;<em>Marss (latīnisks karjaūsnas&nbsp;dēiws, en pagaūsenju bēi tēr āustas&nbsp;dēiws).</em> En stawīdu gintu jaūku wīda baltans, stwi ka tāns peisāi:</p>

<blockquote>
<p>Aulemtāi neurai en waīstasmu kēsmu, ik kwaitēi, mazzi perwartīntun si en wīlkans anga be etkūmps perwartīntun si etwārtai en ka tenēi bēi. Tenēisan wisēisan dēiws ast Marss. Prīki tenesse statūwans tenesmu palīki di kalabijjans be tarkinins be apperaui di zmānins.</p>
</blockquote>

<p><strong>Joannes Malalas</strong>, peisāntei swāise krōnikin en 1261 m., paminijja prūsans, jātawjans be dēiwan <a href="#Perkuns"><strong>Perkūnan</strong></a>:&nbsp;</p>

<blockquote>
<p>Ō, debīkan&nbsp;dīwelas papāikan, kawīdan bēi enwestan en leītawjans&nbsp;be&nbsp;jattawjans, be prūsans&nbsp;<span style="line-height: 1.6em;">[..]</span></p>

<p>Stawīdan papāikan Sōwijs&nbsp;paplattinuns, kāi tenēi apperaulai dīweliskamans deiwammans &nbsp;Andaju&nbsp;be Perkūnu [..]</p>
</blockquote>

<p>Kittan rēizan <a href="#Perkuns"><strong>Perkūns</strong></a> jāu paminītan en XIV mm. en <em>Ēlbingas wirdeīnu</em>:&nbsp;</p>

<blockquote>
<p>50 &mdash; Donner &mdash; Percunis</p>
</blockquote>

<p>Dīgi&nbsp;<span style="line-height: 1.6em;">paminītan&nbsp;en 1529 m. en <strong>Simōnas Grunau</strong> (1470-1530)&nbsp;<em>Prūsiskai krōnikei</em>:</span></p>

<blockquote>
<p>Prei pirman tenēi zēidi <a href="#Pratennis">Pratennju</a> be tenesse deiwammans sklāitewingiskans buttans. Deiwāi bēi trīs: <a href="#Patals">Patals</a> (Patollo), <a href="#Patrimps">Patrīmps</a> (Patrimpo) be <a href="#Perkuns">Perkūns</a> (Perkuno), tenēisan [buweīns] bēi ussjan wāltin stāras <a href="#anzans">anzans</a>.</p>
</blockquote>

<p><strong>M. Prātorius</strong> autenginna prei <strong>Hennenbergeran</strong>, kaddan ebpeisāi <a href="#Ramawa"><strong>Rāmawan</strong></a> be <a href="#Perkūns"><strong>Perkūnan</strong></a>:</p>

<blockquote>
<p><a href="#Perkuns]">Perkūns</a> (Perckunas) bēi na kittan wippjan [&mdash; stesse anzas], tāns etwaidīntan kāigi nērtingis wīrs, wārmis kāigi pannu, sen krōnin stēisan lāpan, wītan kīrsnan bārdan, wārgai dirīwuns en <a href="#Patrimps">Patrīmpan</a> (Potrympum); tenesmu prawerēi aīnat tappintun pannu sen malkans stēisan sāusan anzanan, be en stesmu pannu bēi deggintan apperan, adder ik pannu gessa, sta ka&scaron;tūwa waidīlui, kawīds papekāwuns ugnin, gīwan.&nbsp;</p>
</blockquote>
