					    <div class='rightimage'><a class='fullview' href='/upload/Sudovian_Book_-_sacrifice_of_goat.jpg'><img src='/upload/sm_Sudovian_Book_-_sacrifice_of_goat.jpg'></a><p><strong>Wazuks be wārskaits</strong>Iliustraciōni iz <strong>Sūdawiskan lāiskikan</strong> (1563 m.).</p></div>					    <p><a href="#wazuks">Wazuks</a> bēi ains iz swarewīngjaisins zwērins: tāns pastāi apperautan spārts deznimai, sklāitewingi ezze stan peisātan en <strong>Sūdawisku laiskiku</strong>&nbsp;[<em>Wazukkas upperausna prei nidruwīngins jātawins sen sklaitawīdans dāinans, kawīdans tenēi izpilninusis zūrgi 1520-1530 m.</em>] (1563 m.), pilnai ezze stan <a href="http://awizi.twanksta.org/etnografija/sudawisks-laiskiks/">stwi</a>:</p>

<blockquote>
<p>Adder kaddan tenēi kwaitēi upperautun wazukkan, staddan ketturjai anga pēnkerjai kāimai rīnka si. Ik tenēisan ast tūlan, kāupja di kurwans be rīnka si wisāi en ainasmu buttan. Stwi labbai endegga pelannan, gennas perpēda gāidjas miltan be engnāta zīngslan. Wazukkan anga kurwans tenēi etwedda prei Wārskaitan (Wourschkaiti), &scaron;is nalazīna dwāi rānkans nō tennan be bilāi, madlintei wissans dēiwans, kāi tenēi enīmlai tenēisan swentikans be swentinlai &scaron;ins mēnsans be gēitin, kāi tenēi mazīlai sen teīsin upperautun.</p>
</blockquote>

<p>En <strong>Albrechtas Branderbugiskas lapīnsnai</strong> (1525&nbsp;m.) mazīngi skaitātun stan ezze wazukkan:</p>

<blockquote>
<p>Kwei kliptinai dwiggubawingjas reputācijas preddikerjai, senskītjai be kitāi nekrikstjāniskai makinnewjai stēisan wīran be gennan buwinna empēreniskai stabmadliskai, zmānintei be madlīntei swentan wazukkan, prawīdawintei anga dezīntei palīgjans pawīstins, tēt dīgi nekrisktjāniskai laikāntei si, stwen prawerru tennans stūrnawingiskai papekātun.&nbsp;</p>
</blockquote>
